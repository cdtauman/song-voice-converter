name: Windows release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install locked runtime
        shell: pwsh
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/Scripts/python.exe -c constraints.txt ".[dev,rvc,training]" audio-separator==0.44.5 pymss==2.1.3
          uv pip check --python .venv/Scripts/python.exe
      - name: Unit and isolation gates
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pytest
          .venv/Scripts/python.exe env-bench/verify_isolation.py
          .venv/Scripts/python.exe tools/audit_constraints_licenses.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build online installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          packaging/build.ps1 -Version $version
          packaging/build-update.ps1 -Version $version
      - name: Build verified offline payload and installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .venv/Scripts/python.exe packaging/build-offline-models.py
          packaging/build.ps1 -Version $version -Offline
      - name: Clean-machine install and uninstall flows
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          packaging/verify-clean-machine.ps1 -Installer "packaging/output/SongVoice-$version-Setup.exe"
          packaging/verify-clean-machine.ps1 -Installer "packaging/output/SongVoice-$version-Offline-Setup.exe" -Offline
      - name: Optional Authenticode signing
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/sign.ps1
      - name: Hash release artifacts
        shell: pwsh
        run: |
          Get-ChildItem packaging/output/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content packaging/output/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: packaging/output/*
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/output/*
