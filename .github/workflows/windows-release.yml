name: Windows release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install locked runtime
        shell: pwsh
        run: |
          uv venv --python 3.11 .venv
          if ($LASTEXITCODE -ne 0) { throw "Unable to create the release environment" }
          uv pip install --python .venv/Scripts/python.exe --index-url https://download.pytorch.org/whl/xpu --extra-index-url https://pypi.org/simple --index-strategy unsafe-best-match -c constraints.txt -r rvc-requirements.lock ".[dev,gui,rvc,training]"
          if ($LASTEXITCODE -ne 0) { throw "Unable to install the locked release runtime" }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw "The locked release runtime is inconsistent" }
          .venv/Scripts/python.exe -c "import PySide6, torch, audio_separator, svc_app, svc_engine"
          if ($LASTEXITCODE -ne 0) { throw "The complete release runtime is unavailable" }
      - name: Unit and isolation gates
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pytest
          .venv/Scripts/python.exe env-bench/verify_isolation.py
          .venv/Scripts/python.exe tools/audit_constraints_licenses.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build online installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          packaging/build.ps1 -Version $version
          packaging/build-update.ps1 -Version $version
      - name: Build verified offline payload and installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .venv/Scripts/python.exe packaging/build-offline-models.py
          packaging/build.ps1 -Version $version -Offline
      - name: Clean-machine install and uninstall flows
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          packaging/verify-clean-machine.ps1 -Installer "packaging/output/SongVoice-$version-Setup.exe"
          packaging/verify-clean-machine.ps1 -Installer "packaging/output/SongVoice-$version-Offline-Setup.exe" -Offline
      - name: Optional Authenticode signing
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/sign.ps1
      - name: Split oversized offline installer for GitHub Releases
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          packaging/split-release-asset.ps1 -Path "packaging/output/SongVoice-$version-Offline-Setup.exe"
          Copy-Item packaging/join-release-asset.ps1 packaging/output/Join-SongVoice-Offline-Installer.ps1 -Force
          Get-ChildItem packaging/output -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content packaging/output/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: packaging/output/*
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/output/*
