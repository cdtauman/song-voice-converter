name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests · licences
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 only: the Phase 1 spike showed 3.12 breaks audio-separator via
        # librosa 1.0.0 dropping audioread. See docs/compat-matrix.md.
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Install project
        run: uv pip install --python .venv\Scripts\python.exe -e ".[dev]"

      # Audio fixtures exercise the real ffmpeg/ffprobe boundary.  Use the
      # exact checksum-verified LGPL build that the release ships; Chocolatey
      # builds may omit the Soxr resampler required by the audio contract.
      - name: Provision release FFmpeg
        shell: pwsh
        run: |
          & packaging\fetch-dependencies.ps1
          (Resolve-Path "packaging\build\dependencies\ffmpeg\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Lint (ruff)
        run: .venv\Scripts\python.exe -m ruff check .

      - name: Types (mypy)
        run: .venv\Scripts\python.exe -m mypy

      - name: Unit tests
        run: .venv\Scripts\python.exe -m pytest

      # Approved policy: no copyleft dependency may enter the distributable core.
      - name: Licence check (dependencies)
        run: .venv\Scripts\python.exe tools\check_licenses.py

      # Model weights carry their own licences, separate from the code that runs
      # them. A new catalogue entry without a recorded audit fails here.
      - name: Licence check (model catalogue)
        run: .venv\Scripts\python.exe tools\check_model_catalogue.py

      # The architectural boundaries are enforced by tests, but run them alone
      # too so a failure here is unmistakable in the log.
      - name: Architecture boundaries
        run: .venv\Scripts\python.exe -m pytest tests/unit/test_boundaries.py -v

      - name: Doctor smoke run
        run: .venv\Scripts\python.exe -m svc_engine.cli doctor --json
        continue-on-error: true   # CI runners have no GPU; doctor is expected to warn
