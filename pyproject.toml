[project]
name = "songvoice"
version = "0.1.0"
description = "SongVoice - local high-quality singing voice conversion for Windows"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# Phase 1 keeps runtime dependencies deliberately minimal.
# The heavy AI stack (torch, separation, RVC) is resolved by the Compatibility
# Spike and pinned in constraints.txt -- it is NOT declared here yet.
dependencies = [
    "numpy>=1.26",
    "platformdirs>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
svc = "svc_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_engine", "src/svc_app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
